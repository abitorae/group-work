<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <title>登录</title>
    <style>
        body { font-family: sans-serif; display:flex; justify-content:center; padding-top:100px; }
        form { border:1px solid #ccc; padding:24px; width:280px; border-radius:8px; }
        h2 { text-align:center; }
        label { display:block; margin:8px 0 4px; }
        input { width:100%; padding:8px; box-sizing:border-box; }
        button { width:100%; padding:10px; margin-top:16px; }
        #msg { margin-top:12px; text-align:center; color:red; }
    </style>
</head>
<body>
<form action="login" method="post">
    <h2>用户登录</h2>
    <label for="u">用户名</label>
    <input id="u" name="username">
    <label for="p">密码</label>
    <input id="p" type="password" name="password">
    <button type="submit">登录</button>
    <p id="msg"></p>
</form>

<script>
if (new URLSearchParams(location.search).get('error')) {
    document.getElementById('msg').textContent = '用户名或密码错误';
}
</script>
</body>
</html>
